<!-- Inserir DENTRO do painel autenticado Admin, não em página pública da LP. -->
<section id="fineline-admin-calculadora" class="fineline-admin-widget">
  <h2>Calculadora de custos 3D</h2>
  <p>Estimativa por lote. Os valores e a margem são editáveis; não há envio de dados ao servidor.</p>
  <form id="fineline-calculadora-form" class="fineline-widget-grid">
    <label>Filamento usado no lote (g)<input name="grams" type="number" min="0" step="0.1" value="100" required></label>
    <label>Preço do filamento (R$/kg)<input name="kgPrice" type="number" min="0" step="0.01" value="100" required></label>
    <label>Tempo de impressão (horas)<input name="hours" type="number" min="0" step="0.01" value="5" required></label>
    <label>Consumo da impressora (W)<input name="powerWatts" type="number" min="0" step="1" value="150" required></label>
    <label>Tarifa de energia (R$/kWh)<input name="kwhPrice" type="number" min="0" step="0.01" value="0.90" required></label>
    <label>Embalagem do lote (R$)<input name="packaging" type="number" min="0" step="0.01" value="2" required></label>
    <label>Outros custos do lote (R$)<input name="extras" type="number" min="0" step="0.01" value="0" required></label>
    <label>Mão de obra (horas no lote)<input name="laborHours" type="number" min="0" step="0.01" value="0.5" required></label>
    <label>Custo mão de obra (R$/hora)<input name="laborPrice" type="number" min="0" step="0.01" value="20" required></label>
    <label>Perdas de material (%)<input name="wastePct" type="number" min="0" max="100" step="0.1" value="5" required></label>
    <label>Peças produzidas no lote<input name="quantity" type="number" min="1" step="1" value="1" required></label>
    <label>Margem desejada sobre venda (%)<input name="marginPct" type="number" min="0" max="99" step="0.1" value="35" required></label>
    <button type="submit">Calcular custo</button>
  </form>
  <p role="alert" id="fineline-calculadora-erro"></p>
  <div id="fineline-calculadora-resultado" aria-live="polite"></div>
</section>
